version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shoppilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"
    depends_on:
      - db

  backend:
    build: ./backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=shoppilot
    depends_on:
      - db
      - ml-service

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend